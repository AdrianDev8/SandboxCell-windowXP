<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SandboxCell-XP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="xp-screen">

        <div id="taskbar">

            <img
                id="microLogo"
                src="images/MicroLogo.png"
            >

            <img
                id="fileExplorer"
                src="images/filutforsker.png"
                onclick="openSandbox()"
            >

            <img
                id="interXp"
                src="images/interXp.png"
            >

        </div>

        <div id="sandbox">

            <div id="sandboxTitle">
                Sandbox-base
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
